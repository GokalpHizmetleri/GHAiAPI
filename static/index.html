<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GHAi - Next Gen AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Google Sans', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: #131314; /* Dark bg */
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e3e3e3;
        }
        .container {
            text-align: center;
            padding: 40px;
            max-width: 700px;
            width: 90%;
        }
        h1 {
            font-size: 4rem;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #4285F4, #9B72CB, #D96570);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -2px;
        }
        p {
            font-size: 1.5rem;
            color: #aaa;
            margin-bottom: 50px;
            line-height: 1.5;
        }
        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            padding: 16px 32px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s;
            font-size: 1.1rem;
        }
        .btn-primary {
            background-color: #e3e3e3;
            color: #131314;
        }
        .btn-primary:hover {
            background-color: white;
            box-shadow: 0 0 15px rgba(255,255,255,0.2);
        }
        .btn-secondary {
            background-color: transparent;
            color: #e3e3e3;
            border: 1px solid #555;
        }
        .btn-secondary:hover {
            border-color: #e3e3e3;
            background-color: rgba(255,255,255,0.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>GHAi</h1>
        <p>Supercharge your creativity and productivity with our most capable AI model yet.</p>
        <div class="buttons">
            <a href="/chat" class="btn btn-primary">Try GHAi</a>
            <a href="/dev" class="btn btn-secondary">For Developers</a>
        </div>
    </div>
</body>
</html>
