<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GHAi - Chatbot</title>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #131314;
            --sidebar-bg: #1e1f20;
            --text-color: #e3e3e3;
            --user-bubble: #282a2c; /* Darker distinct bubble */
            --ai-text: #e3e3e3;
            --input-bg: #1e1f20;
            --input-text: #e3e3e3;
            --accent-color: #4c8df6; /* "Gemini Blue" ish */
            --border-radius: 12px;
        }

        body {
            font-family: 'Google Sans', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            padding: 20px;
            border-right: 1px solid #333;
        }

        .sidebar-header {
            font-size: 1.5rem;
            font-weight: 500;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            color: var(--text-color);
        }

        .sidebar-header span {
            background: linear-gradient(90deg, #4285F4, #9B72CB, #D96570);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        .new-chat-btn {
            background-color: #282a2c;
            color: #e3e3e3;
            border: 1px solid transparent;
            padding: 10px 15px;
            border-radius: 50px;
            cursor: pointer;
            text-align: left;
            font-family: inherit;
            display: flex;
            align-items: center;
            transition: background 0.2s;
            margin-bottom: 20px;
        }

        .new-chat-btn:hover {
            background-color: #333537;
        }

        .new-chat-btn::before {
            content: '+';
            margin-right: 10px;
            font-size: 1.2rem;
        }

        /* Main Chat Area */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .chat-area {
            flex: 1;
            padding: 40px 20px 120px 20px; /* Bottom padding for input area */
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        .message {
            display: flex;
            gap: 15px;
            line-height: 1.6;
            max-width: 100%;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.user .content {
            background-color: var(--user-bubble);
            padding: 10px 20px;
            border-radius: 20px 20px 4px 20px;
            max-width: 70%;
        }

        .message.assistant {
            justify-content: flex-start;
        }

        .message.assistant .icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4285F4, #9B72CB);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
            color: white;
        }

        .message.assistant .content {
            padding-top: 5px; /* Align with icon */
            max-width: 85%;
        }

        /* Input Area */
        .input-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 800px;
            background-color: var(--input-bg);
            border-radius: 50px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 1px solid #333;
        }

        .input-container input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--input-text);
            font-size: 1rem;
            padding: 10px;
            font-family: inherit;
            outline: none;
        }

        .send-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            color: #e3e3e3;
            padding: 10px;
            border-radius: 50%;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-btn:hover {
            background-color: #333537;
        }

        .send-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .typing-indicator {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            color: #aaa;
            font-size: 0.9rem;
            display: none;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                display: none; /* Hide sidebar on mobile for simplicity */
            }
            .chat-area {
                padding-bottom: 100px;
            }
            .input-container {
                width: 95%;
                bottom: 10px;
            }
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <span>GHAi</span>
        </div>
        <button class="new-chat-btn" onclick="location.reload()">New chat</button>
        <!-- History placeholder -->
        <div style="flex:1;"></div>
        <div style="font-size: 0.8rem; color: #777; padding-top: 20px; border-top: 1px solid #333;">
            GHAi may display inaccurate info.
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="chat-area" id="messages">
            <!-- Welcome Message -->
            <div class="message assistant" id="welcomeMsg">
                <div class="icon">G</div>
                <div class="content">
                    <span style="font-size: 2rem; background: linear-gradient(90deg, #4285F4, #9B72CB, #D96570); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: block; font-weight: 500; margin-bottom: 10px;">Hello, Human</span>
                    <span style="font-size: 1.2rem; color: #aaa;">How can I help you today?</span>
                </div>
            </div>
        </div>

        <div class="typing-indicator" id="typing">Thinking...</div>

        <div class="input-container">
            <input type="text" id="userInput" placeholder="Enter a prompt here" autocomplete="off">
            <button class="send-btn" id="sendBtn">
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
            </button>
        </div>
    </div>

    <script>
        const messagesDiv = document.getElementById('messages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const typingIndicator = document.getElementById('typing');
        const welcomeMsg = document.getElementById('welcomeMsg');

        // Client-side memory
        let chatHistory = [];

        function scrollToBottom() {
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function appendUserMessage(text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message user';
            msgDiv.innerHTML = `<div class="content">${escapeHtml(text)}</div>`;
            messagesDiv.appendChild(msgDiv);
            scrollToBottom();
        }

        function appendAIMessage(text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message assistant';
            // Parse simple markdown-like formatting if needed, but for now simple text
            // Just handling newlines
            const formattedText = escapeHtml(text).replace(/\n/g, '<br>');

            msgDiv.innerHTML = `
                <div class="icon">G</div>
                <div class="content">${formattedText}</div>
            `;
            messagesDiv.appendChild(msgDiv);
            scrollToBottom();
        }

        // Simple HTML escape to prevent XSS
        function escapeHtml(text) {
            if (!text) return text;
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Hide welcome message on first chat
            if (welcomeMsg.style.display !== 'none') {
                welcomeMsg.style.display = 'none';
            }

            // Add user message to UI and history
            appendUserMessage(text);
            chatHistory.push({ role: "user", content: text });
            userInput.value = '';

            // Disable input while processing
            userInput.disabled = true;
            sendBtn.disabled = true;
            typingIndicator.style.display = 'block';

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ messages: chatHistory })
                });

                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }

                const data = await response.json();

                if (data.error) {
                    appendAIMessage(`Error: ${data.error}`);
                } else if (data.message && data.message.content) {
                    const aiText = data.message.content;
                    appendAIMessage(aiText);
                    chatHistory.push({ role: "assistant", content: aiText });
                } else {
                    appendAIMessage("Received an unexpected response format.");
                }

            } catch (error) {
                console.error('Error:', error);
                appendAIMessage("Sorry, something went wrong. Please try again.");
            } finally {
                userInput.disabled = false;
                sendBtn.disabled = false;
                typingIndicator.style.display = 'none';
                userInput.focus();
            }
        }

        sendBtn.addEventListener('click', sendMessage);

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
